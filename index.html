<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Acolhe — Painel Clínico</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22 fill=%22%235E7A68%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F6F1E7;--surface:#FFFFFF;--surface-2:#FBF7EF;
  --ink:#2C2722;--ink-soft:#766E63;--line:#E8DECC;
  --sage:#5E7A68;--sage-dark:#43594B;--sage-soft:#E3ECE5;
  --terracotta:#C97A56;--terracotta-soft:#F4DECE;--warn:#B5532E;
  --radius:16px;--radius-sm:10px;--shadow:0 4px 18px rgba(44,39,34,.06);
  --sidebar-w:230px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em;margin:0;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
.icon{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.app{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);background:var(--sage-dark);color:#F4F0E4;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:22px 20px 14px;border-bottom:1px solid rgba(244,240,228,.12);}
.brand-mark{display:flex;align-items:center;gap:10px;}
.brand-mark svg{width:28px;height:28px;}
.brand h1{font-size:20px;color:#fff;}
.brand p{font-size:11.5px;color:#CFE0D4;margin-top:3px;}
nav.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:none;border:none;color:#E7EFE7;font-size:13.5px;font-weight:500;text-align:left;transition:background .15s,color .15s;width:100%;}
.nav-item:hover{background:rgba(244,240,228,.08);}
.nav-item.active{background:#F4F0E4;color:var(--sage-dark);}
.nav-item.active svg{stroke:var(--sage-dark);}
.sidebar-foot{padding:12px 16px 16px;font-size:11px;color:#C8DACE;border-top:1px solid rgba(244,240,228,.12);}
.logout-row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;}
.content{flex:1;min-width:0;padding:28px 32px 90px;max-width:1200px;}
